<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171512" />
    <title>今刻 · 语音日历</title>
    <script>
      (() => {
        let mode = "dark";
        try { mode = localStorage.getItem("jinke-theme") || "dark"; } catch {}
        const resolved = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#171512" : "#F8F6F2";
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/app-icon-512.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.JINKE_BOOT_FAILURE = (message) => {
        console.error("[今刻启动失败]", message);
        document.body.dataset.loadError = String(message || "unknown");
        const root = document.getElementById("root");
        if (!root || root.firstElementChild) return;
        const panel = document.createElement("div");
        panel.className = "boot-error";
        panel.textContent = "今刻启动失败，请安装最新版本。";
        root.appendChild(panel);
      };
      window.addEventListener("error", (event) => window.JINKE_BOOT_FAILURE(event.message));
    </script>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./app-bundle.js?v=1.1.8"></script>
    <script>
      window.setTimeout(() => {
        const root = document.getElementById("root");
        if (!root || !root.firstElementChild) window.JINKE_BOOT_FAILURE("React root was not rendered");
      }, 2500);
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js?v=1.1.8").catch(() => {}));
      }
    </script>
  </body>
</html>
